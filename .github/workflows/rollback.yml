name: Rollback rehearsal
on:
  workflow_dispatch:
    inputs:
      image:
        description: Previously successful signed ghcr.io image@sha256 digest
        required: true
        type: string
permissions:
  contents: read
  packages: read
concurrency:
  group: delivery
  cancel-in-progress: false
jobs:
  rollback:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      image: ${{ inputs.image }}
      target: production
